<title>Count of Ten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow stage. The ring (or the week planner) is the hero; the body chart and corner card sit beside it like a cutman's clipboard. Deliberately single-theme: a night gym under sodium light. */
:root{
  --ink:#15131d; --ink2:#1e1b2a; --panel:#262233; --line:#3b3550;
  --canvas:#ece3cf; --dim:#a49cb2; --blood:#d4432f; --gold:#e7aa3d; --bruise:#9479c4; --ok:#73c27a;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-body:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--canvas)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
#app{max-width:1080px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(28px,6vw,52px);line-height:1}
h2{font-size:20px}
h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
.dim{color:var(--dim)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border-bottom:2px solid var(--line);padding-bottom:10px}
.bar .brand{font-family:var(--f-display);font-size:16px;color:var(--gold)}
.bar .stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
button,.btn{font-family:var(--f-display);font-size:12px;background:var(--ink2);color:var(--canvas);border:2px solid var(--line);padding:8px 10px;cursor:pointer;text-align:left;line-height:1.2}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:var(--blood);border-color:var(--blood);color:#fff}
button.primary:hover:not(:disabled){border-color:var(--gold)}
button.sel{border-color:var(--gold);background:#3a2f22}
select,input[type=text]{font-family:var(--f-body);font-size:14px;background:var(--ink2);color:var(--canvas);border:1px solid var(--line);padding:5px 6px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
label{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;padding:0;border:2px solid var(--line)}
.swatch.sel{border-color:var(--gold);outline:2px solid var(--gold)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;max-width:100%}
.meter{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:13px}
.meter .track{height:8px;background:var(--ink2);border:1px solid var(--line);position:relative}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.meter .v{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--dim)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-size:10px;padding:5px 7px}
/* Title */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .lede{font-size:17px;max-width:58ch}
.tag{font-family:var(--f-display);font-size:11px;color:var(--blood);letter-spacing:.1em}
/* Planner */
.plan{display:flex;flex-direction:column;gap:6px}
.day{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.day .dn{font-family:var(--f-display);font-size:12px;color:var(--gold)}
.slothead{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr));gap:6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){.day{grid-template-columns:34px repeat(2,minmax(0,1fr))}.day .dn{grid-row:span 2}.slothead{display:none}}
.log{font-family:var(--f-mono);font-size:12.5px;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:3px;background:var(--ink2);padding:10px;border:1px solid var(--line)}
.log .d{color:var(--gold)}
.log .bad{color:#f08a7a}
.log .good{color:var(--ok)}
.person{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:6px;align-items:center;font-size:13.5px}
.person .track{height:6px;background:var(--ink2);border:1px solid var(--line);position:relative}
.person .fill{position:absolute;inset:0 auto 0 0;background:var(--bruise)}
/* Fight */
.stage{position:relative;border:2px solid var(--line);background:#0c0b12}
.hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:6px 8px;pointer-events:none;font-family:var(--f-display);font-size:10px}
.hud .side{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud .side.r{align-items:flex-end;text-align:right}
.hud .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:1px 1px 0 #000}
.hb{width:min(170px,100%);height:6px;background:rgba(0,0,0,.6);border:1px solid #000;position:relative}
.hb i{position:absolute;inset:0 auto 0 0}
.side.r .hb i{inset:0 0 0 auto}
.clock{text-align:center;font-size:14px;text-shadow:1px 1px 0 #000;color:var(--gold)}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(18px,4vw,34px);color:#fff;text-shadow:3px 3px 0 var(--blood);pointer-events:none;white-space:nowrap}
.read{background:var(--ink2);border:1px solid var(--line);border-left:4px solid var(--gold);padding:8px 10px;font-size:14.5px}
.read b{font-family:var(--f-display);font-size:11px;color:var(--gold);font-weight:400;margin-right:6px}
.pad{display:flex;flex-direction:column;gap:8px}
.pad .grp{display:flex;flex-direction:column;gap:4px}
.pad .grp>span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pad .btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.pad button{font-size:10.5px;padding:7px 6px;display:flex;justify-content:space-between;gap:4px}
.pad button kbd{font-family:var(--f-mono);color:var(--dim);font-size:10px}
.pad button.far{border-style:dashed;opacity:.62}
.combo-q{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(8,7,12,.82);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:50}
#modal .box{background:var(--panel);border:2px solid var(--gold);max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#modal .scene{font-size:16px;line-height:1.55}
#modal .speaker{font-family:var(--f-display);color:var(--gold);font-size:12px}
.choices{display:flex;flex-direction:column;gap:6px}
.count{font-family:var(--f-display);font-size:64px;color:#fff;text-align:center;text-shadow:4px 4px 0 var(--blood);line-height:1}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.mem button{display:flex;flex-direction:column;gap:4px;font-size:11px}
.mem button small{font-family:var(--f-body);font-size:12.5px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.cards button{display:flex;flex-direction:column;gap:4px}
.cards button small{font-family:var(--f-body);font-size:12.5px;color:var(--dim);line-height:1.35}
table.score{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;width:100%}
table.score td,table.score th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px;font-size:12px;font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="bar"><span class="brand">COUNT OF TEN</span><div class="stats" id="topstats"></div></div>
  <main id="view"></main>
</div>
<div id="modal" hidden><div class="box" id="modalbox"></div></div>

<script>
'use strict';
/* =====================================================================
   COUNT OF TEN — turn-based boxing + life sim vertical slice
   One turn = one second. Hitboxes are tested point-by-point against the
   defender's pose; damage lands on bones, muscles and organs.
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------------------- STYLES ---------------------------- */
const STYLES={
  swarmer:{name:'Swarmer',blurb:'Pressure. Bob under the hook, live in the pocket, dig the body.',range:0,
    mods:{hook:1.12,body:1.12,exec:{duck:.12},weaveHook:1.6},sig:'A hook thrown right after a successful duck lands 60% harder.'},
  outboxer:{name:'Out-boxer',blurb:'Long jab, clean feet. Make them miss from outside, make them pay.',range:2,
    mods:{long:1.22,outFree:true,exec:{pull:.12}},sig:'Straights at long range +22%. Stepping out costs nothing.'},
  counter:{name:'Counter-puncher',blurb:'Wait. Read. Punish. You win the second after they commit.',range:1,
    mods:{counter:1.75,read:.12,exec:{slip:.1}},sig:'Counters land 75% harder (others get 40%). Sharper reads.'},
  slugger:{name:'Slugger',blurb:'One clean shot changes everything. Heavy hands, granite chin, slow feet.',range:1,
    mods:{power:1.15,over:1.25,chin:12,speed:1.12},sig:'Overhand +25%, power +15%, chin +12. Hands are slower.'},
  peekaboo:{name:'Peek-a-boo',blurb:'Gloves high, head moving, explode from the crouch with uppercuts.',range:0,
    mods:{upper:1.18,tightGuard:true,exec:{slip:.08,duck:.08}},sig:'Tighter high guard. Uppercuts +18%.'},
};

/* ---------------------------- TECHNIQUES ----------------------------
   ranges: 0 = inside, 1 = mid, 2 = long. speed: seconds-fraction (lower is faster) */
const TECH={
  jab:{n:'Jab',kind:'punch',type:'straight',target:'head',hand:'lead',ranges:[1,2],speed:1.0,power:4,cost:2,skill:'straight',key:'1'},
  cross:{n:'Cross',kind:'punch',type:'straight',target:'head',hand:'rear',ranges:[1,2],speed:1.6,power:9,cost:4,skill:'straight',key:'2'},
  hook:{n:'Lead Hook',kind:'punch',type:'hook',target:'head',hand:'lead',ranges:[0,1],speed:1.7,power:10,cost:5,skill:'hook',key:'3'},
  upper:{n:'Uppercut',kind:'punch',type:'upper',target:'head',hand:'rear',ranges:[0],speed:1.8,power:11,cost:5,skill:'upper',key:'4'},
  overhand:{n:'Overhand',kind:'punch',type:'overhand',target:'head',hand:'rear',ranges:[1,2],speed:2.3,power:14,cost:7,skill:'straight',key:'5'},
  bjab:{n:'Body Jab',kind:'punch',type:'straight',target:'body',hand:'lead',ranges:[1,2],speed:1.1,power:4,cost:2,skill:'body',key:'6'},
  bcross:{n:'Body Cross',kind:'punch',type:'straight',target:'body',hand:'rear',ranges:[1],speed:1.6,power:8,cost:4,skill:'body',key:'7'},
  liver:{n:'Liver Hook',kind:'punch',type:'hook',target:'body',hand:'lead',ranges:[0,1],speed:1.8,power:9,cost:5,skill:'body',key:'8'},
  high:{n:'High Guard',kind:'def',cost:.5,key:'q'},
  low:{n:'Elbows Down',kind:'def',cost:.5,key:'w'},
  slip:{n:'Slip',kind:'def',cost:1.5,key:'e'},
  duck:{n:'Duck & Weave',kind:'def',cost:2,key:'r'},
  pull:{n:'Pull Back',kind:'def',cost:1,key:'t'},
  clinch:{n:'Clinch',kind:'clinch',cost:-1,key:'y'},
  in:{n:'Step In',kind:'move',cost:1,key:'a'},
  out:{n:'Step Out',kind:'move',cost:1,key:'s'},
  circle:{n:'Circle',kind:'move',cost:-2.5,key:'d'},
  feint:{n:'Feint',kind:'feint',cost:1,key:'f'},
};
const PUNCHES=Object.keys(TECH).filter(k=>TECH[k].kind==='punch');
const ALL_ACTS=Object.keys(TECH);
const DEFENSIVE=['high','low','slip','duck','pull','clinch'];

/* ---------------------------- HITBOX GEOMETRY ----------------------------
   Defender frame, seen from the attacker: x is lateral (viewer-left = defender's right side),
   y runs down from the top of the head. Liver sits on the defender's right (x<0). */
const HEAD_B=[-8,0,8,18], TORSO_B=[-12,22,12,58];
const REG_HEAD=[[-2,13,2,18,'chin'],[-2,9,2,13,'nose'],[-5,5,-1,9,'eye'],[1,5,5,9,'eye'],[-8,1,-4,9,'temple'],[4,1,8,9,'temple'],[-8,9,-2,18,'jaw'],[2,9,8,18,'jaw']];
const REG_BODY=[[-4,32,4,42,'solar'],[-12,42,-3,52,'liver'],[3,42,12,52,'spleen'],[-12,32,-4,42,'ribs'],[4,32,12,42,'ribs'],[-12,22,12,32,'chest']];
/* Punch impact shapes for an orthodox attacker (mirrored for southpaws). Aimed where the head/body is at rest. */
const SHAPES={jab:[-3,6,3,16],cross:[-2,6,4,16],hook:[-17,3,1,15],upper:[-3,8,5,38],overhand:[-3,-3,15,9],bjab:[-4,32,4,42],bcross:[-3,32,5,44],liver:[-17,40,-1,52]};
/* Guards: g = gloves, f = forearms. index 0 = rear hand, 1 = lead hand (orthodox; mirrored for southpaw). */
const GUARDS={
  neutral:{g:[[-9,9,-1,17],[1,7,8,15]],f:[[-11,17,-7,30],[7,15,11,28]]},
  high:{g:[[-7,3,0,16],[0,3,7,16]],f:[[-8,16,-3,34],[3,16,8,34]]},
  highT:{g:[[-8,2,0,17],[0,2,8,17]],f:[[-9,17,-3,36],[3,17,9,36]]},
  low:{g:[[-6,30,0,40],[0,30,6,40]],f:[[-13,30,-5,52],[5,30,13,52]]},
  duck:{g:[[-12,20,-6,30],[6,20,12,30]],f:[]},
  dropped:{g:[[-12,32,-6,40],[6,32,12,40]],f:[]},
  clinch:{g:[[-16,24,-10,32],[10,24,16,32]],f:[]},
};
const inR=(x,y,r)=>x>=r[0]&&x<r[2]&&y>=r[1]&&y<r[3];
const mirrorR=r=>[-r[2],r[1],-r[0],r[3],r[4]];
function regionAt(list,x,y){for(const r of list)if(inR(x,y,r))return r[4];return null}

function poseOf(act,o){
  const p={hx:0,hy:0,tx:0,ty:0,depth:0,guard:'neutral',gx:0,gy:0,drop:null};
  const e=o.exec??1, dir=o.attSouthpaw?1:-1; // slip toward the attacker's lead-hook side
  if(o.frozen||act==='frozen'){p.guard='dropped'}
  else switch(act){
    case 'high':p.guard=o.tight?'highT':'high';break;
    case 'low':p.guard='low';break;
    case 'slip':p.hx=10*dir*e;p.hy=3*e;p.tx=3*dir*e;p.gx=5*dir*e;break;
    case 'duck':p.hx=-2*e;p.hy=18*e;p.ty=8*e;p.guard=e>.55?'duck':'neutral';p.gy=e>.55?0:8*e;break;
    case 'pull':p.depth=e>.55?1:0;p.hy=2;break;
    case 'clinch':p.guard='clinch';p.hx=6;p.hy=4;break;
    case 'feint':p.drop='lead';break;
    default:if(TECH[act]&&TECH[act].kind==='punch')p.drop=TECH[act].hand;
  }
  const G=GUARDS[p.guard];
  let g=G.g.map(r=>[r[0]+p.gx,r[1]+p.gy,r[2]+p.gx,r[3]+p.gy]), f=G.f.map(r=>[r[0]+p.gx,r[1]+p.gy,r[2]+p.gx,r[3]+p.gy]);
  if(o.defSouthpaw){g=g.map(mirrorR);f=f.map(mirrorR)}
  if(p.drop){const i=p.drop==='lead'?1:0;g=g.filter((_,k)=>k!==i);if(f.length===2)f=f.filter((_,k)=>k!==i)}
  p.guards=g.concat(f);
  return p;
}
function hitTest(shape,target,P,reachDepth){
  let contact=0,blocked=0,cleanN=0;const clean={};
  for(let x=shape[0];x<shape[2];x++)for(let y=shape[1];y<shape[3];y++){
    let reg=null;
    if(target==='head'){const lx=x-P.hx,ly=y-P.hy;if(inR(lx,ly,HEAD_B)&&!(P.depth&&!reachDepth))reg=regionAt(REG_HEAD,lx,ly)||'forehead'}
    else{const lx=x-P.tx,ly=y-P.ty;if(inR(lx,ly,TORSO_B))reg=regionAt(REG_BODY,lx,ly)||'stomach'}
    if(!reg)continue;
    contact++;
    if(P.guards.some(g=>inR(x,y,g)))blocked++;else{clean[reg]=(clean[reg]||0)+1;cleanN++}
  }
  return{contact,blocked,cleanN,clean};
}
const N0={};
for(const k of PUNCHES){const P={hx:0,hy:0,tx:0,ty:0,depth:0,guards:[]};N0[k]=hitTest(SHAPES[k],TECH[k].target,P,true).contact}
const shapeFor=(k,south)=>south?mirrorR(SHAPES[k]):SHAPES[k];

/* What each region does to the body */
const REGFX={
  chin:{shock:1.6,bone:'jaw',lbl:'on the button'},jaw:{shock:1.3,bone:'jaw',lbl:'on the jaw'},
  temple:{shock:1.25,bone:'skull',lbl:'at the temple'},forehead:{shock:.7,bone:'skull',hand:1.6,lbl:'off the forehead'},
  eye:{shock:.8,swell:1.3,bone:'orbital',lbl:'over the eye'},nose:{shock:.7,bone:'nose',bleed:1,lbl:'on the nose'},
  chest:{stam:.6,shock:.1,lbl:'into the chest'},solar:{stam:2.2,wind:.28,lbl:'into the solar plexus'},
  ribs:{stam:1,bone:'ribs',lbl:'into the ribs'},liver:{stam:1.4,liver:1.25,lbl:'into the liver'},
  spleen:{stam:1.1,liver:.6,lbl:'under the ribs'},stomach:{stam:1.2,lbl:'into the stomach'},
};

/* ---------------------------- FIGHTERS ---------------------------- */
function baseFightState(F){
  Object.assign(F,{stamina:F.stamMax,shock:0,shockTotal:0,liverLoad:0,liverFuse:0,swell:0,bleed:0,
    frozen:0,counterReady:false,afterDuck:false,kds:0,limit:0,trueRead:false,resolve:F.resolve||20,
    bone:Object.assign({skull:0,jaw:0,nose:0,orbital:0,ribs:0,handL:0,handR:0},F.bone||{}),
    musc:{arms:0,legs:0,core:0},hitLog:{}});
  return F;
}
function fighterFromPlayer(p){
  const b=p.body,m=b.muscle,o=b.organs,s=p.skills,st=STYLES[p.style].mods;
  const sleepPen=clamp(p.sleepDebt/25,0,.45), fat=p.fatigue/100, nutr=p.nutrition<40?(40-p.nutrition)/80:0;
  const F={name:p.name,short:p.name.split(' ')[0],isPlayer:true,style:p.style,southpaw:p.stance==='southpaw',
    reach:p.height+p.reachAdj,height:p.height,weight:p.weight,look:p.look,iq:s.ringIQ,defense:s.defense,footwork:s.footwork,skills:s,sleepPen};
  F.powerMult=(.65+(m.arms*.3+m.shoulders*.25+m.core*.25+m.legs*.2)/100*.6+(p.weight-62)/120)*(1-fat*.25)*(st.power||1);
  F.speedMult=(1.15-s.footwork/400-m.arms/800)*(1+sleepPen*.5)*(st.speed||1);
  F.chin=(45+m.neck*.35+o.brain*.25+(st.chin||0))*(1-sleepPen*.4)*(b.skel.jaw/100*.3+.7);
  F.liverMax=30+m.core*.35+o.liver*.05;
  F.stamMax=Math.round((55+o.heart*.45+o.lungs*.25)*(1-fat*.35-nutr));
  F.regen=.6+o.heart/90+o.lungs/140;
  F.boneF=b.skel.density/80;
  F.bone={skull:100-b.skel.skull,jaw:100-b.skel.jaw,nose:100-b.skel.nose,orbital:100-b.skel.orbital,ribs:100-b.skel.ribs,handL:100-b.skel.handL,handR:100-b.skel.handR};
  const bonds=Object.values(p.rel).map(r=>r.bond).sort((a,b)=>b-a);
  F.resolve=clamp(10+(bonds[0]+bonds[1])*.25-p.stress*.15,5,60);
  return baseFightState(F);
}

/* ---------------------------- EXCHANGE RESOLUTION ---------------------------- */
function execQ(F,act,rng){
  const st=STYLES[F.style].mods;
  let e=.55+F.defense/220+F.footwork/600+((st.exec||{})[act]||0)-F.sleepPen*.5;
  if(F.stamina<F.stamMax*.2)e-=.18;
  if(F.limit)e+=.1;
  if(rng)e+=(rng()-.5)*.3;
  return clamp(e,.3,1);
}
function styleMult(F,k,r){
  const t=TECH[k],m=STYLES[F.style].mods;let v=1;
  if(t.type==='hook'&&t.target==='head'&&m.hook)v*=m.hook;
  if(t.target==='body'&&m.body)v*=m.body;
  if(t.type==='upper'&&m.upper)v*=m.upper;
  if(t.type==='overhand'&&m.over)v*=m.over;
  if(t.type==='straight'&&r===2&&m.long)v*=m.long;
  if(t.type==='hook'&&F.afterDuck&&m.weaveHook)v*=m.weaveHook;
  return v;
}
function handOf(F,k){const lead=TECH[k].hand==='lead';return (lead!==F.southpaw)?'handL':'handR'}
function computeExchange(A,a,B,b,st){
  const sim=!!st.sim, rng=sim?null:Math.random;
  if(A.frozen>0)a='frozen'; if(B.frozen>0)b='frozen';
  const r0=st.range, mv=x=>x==='in'?-1:x==='out'?1:0;
  let r=clamp(r0+mv(a)+mv(b),0,2), clinch=false;
  if((a==='clinch'||b==='clinch')&&r0<=1){const other=a==='clinch'?b:a;if(other!=='out'){clinch=true;r=0}}
  const out={range:r,clinch,hits:[],feint:null,evaded:{A:false,B:false},dmgTo:{A:0,B:0},acts:{A:a,B:b}};
  const isDef=x=>DEFENSIVE.includes(x);
  if(a==='feint'&&isDef(b))out.feint={by:'A',on:'B'};
  if(b==='feint'&&isDef(a))out.feint={by:'B',on:'A'};
  const sides=[['A',A,a,'B',B,b],['B',B,b,'A',A,a]];
  for(const[id,X,x,yid,Y,y]of sides){
    const t=TECH[x];if(!t||t.kind!=='punch')continue;
    const h={att:id,def:yid,tech:x,res:'miss',region:null,dmg:0,mult:0,counter:false,speed:t.speed*X.speedMult,walkIn:false};
    let decided=false, jam=1;
    if(clinch){decided=true;if(t.type==='straight'||t.type==='overhand')h.res='smothered';else{h.res='hit';h.mult=t.target==='body'?.6:.35;h.region=t.target==='body'?'ribs':'jaw'}}
    else if(!t.ranges.includes(r)){if(r<Math.min(...t.ranges))jam=.5;else{h.res='short';decided=true}}
    if(!decided){
      const P=poseOf(y,{defSouthpaw:Y.southpaw,attSouthpaw:X.southpaw,exec:sim?execQ(Y,y):execQ(Y,y,rng),frozen:Y.frozen>0,tight:STYLES[Y.style].mods.tightGuard});
      const reach=X.reach-Y.reach>=6||r===0;
      const T=hitTest(shapeFor(x,X.southpaw),t.target,P,reach);h.pose=P;
      const frac=T.contact/N0[x];
      if(frac<.2)h.res='miss';
      else{const ratio=T.cleanN/T.contact;
        if(ratio<.3){h.res='blocked';h.mult=.15}
        else{h.res='hit';h.mult=Math.min(1,frac*1.5)*Math.pow(ratio,.7)*(frac>1.2?1.3:1)*jam;
          h.region=Object.entries(T.clean).sort((p,q)=>q[1]-p[1])[0][0];
          if(frac>1.2)h.walkIn=true}}
    }
    if(h.res==='hit'||h.res==='blocked'){
      const hand=X.bone[handOf(X,x)]>55?.55:1;
      const stam=X.stamina<X.stamMax*.25?.65+X.stamina/X.stamMax:1;
      let d=t.power*X.powerMult*(.75+X.skills[t.skill]/200)*styleMult(X,x,r)*h.mult*stam*hand*(X.limit?1.3:1);
      if(r===2&&t.type==='straight')d*=clamp(1+(X.reach-Y.reach)/100,.85,1.15);
      if(h.res==='hit'&&X.counterReady){d*=STYLES[X.style].mods.counter||1.4;h.counter=true}
      if(h.res==='hit'&&y==='in'){d*=1.25;h.walkIn=true}
      h.dmg=d;
    }
    if(h.res==='miss'&&['slip','duck','pull'].includes(y))out.evaded[yid]=true;
    out.hits.push(h);
  }
  if(out.hits.length===2&&out.hits.every(h=>h.res==='hit')){
    const[h1,h2]=out.hits, fast=h1.speed<=h2.speed?h1:h2, slow=fast===h1?h2:h1;
    if(slow.speed-fast.speed>.2&&fast.dmg>=4){slow.dmg*=.5;slow.disrupted=true;if(!fast.counter){fast.dmg*=1.2;fast.counter=true}}
  }
  for(const h of out.hits)out.dmgTo[h.def]+=h.dmg*(h.res==='blocked'?.3:1)*(h.region&&REGFX[h.region].shock>1.2?1.25:1);
  return out;
}

const STYLE_PRIOR={
  slugger:{overhand:.9,cross:.5,hook:.5,in:.3,high:.2},
  counter:{slip:.7,pull:.6,jab:.3,cross:.4,circle:.3},
  swarmer:{in:.7,hook:.6,liver:.6,duck:.5,upper:.3},
  outboxer:{jab:.9,out:.4,circle:.4,pull:.3,cross:.3},
  peekaboo:{high:.5,duck:.5,upper:.6,hook:.4,in:.4},
};
function updModel(M,a){
  for(const k in M.g)M.g[k]*=.96;
  M.g[a]=(M.g[a]||0)+1;
  (M.n[M.prev]=M.n[M.prev]||{});M.n[M.prev][a]=(M.n[M.prev][a]||0)+1;
  M.prev=a;
}
function legalActs(range){
  return ALL_ACTS.filter(k=>!(k==='in'&&range===0)&&!(k==='out'&&range===2)&&!(k==='clinch'&&range===2));
}
function aiChoose(X,Y,range,M,greedy){
  const acts=legalActs(range), iqF=clamp(X.iq/100,.1,.95);
  const dist={};let tot=0;
  for(const k of acts){
    let w=1+(M.g[k]||0)*.6+((M.n[M.prev]||{})[k]||0)*2.5;
    if(TECH[k].kind==='punch'&&!TECH[k].ranges.includes(range))w*=.3;
    w=lerp(1,w,iqF);dist[k]=w;tot+=w}
  const top=Object.entries(dist).sort((p,q)=>q[1]-p[1]).slice(0,8);const tt=top.reduce((s,e)=>s+e[1],0);
  const pref=STYLES[X.style].range, prior=STYLE_PRIOR[X.style]||{};
  const scores=acts.map(c=>{
    let v=0;
    for(const[p,w]of top){
      const ex=computeExchange(X,c,Y,p,{range,sim:true});
      let val=ex.dmgTo.B*1.0-ex.dmgTo.A*1.15;
      if(ex.range===pref)val+=.6;
      if(ex.feint&&ex.feint.by==='A')val+=2.5;
      if(ex.evaded.A)val+=1.2;
      v+=val*w/tt;
    }
    const cost=TECH[c].cost||0;
    v-=cost*(X.stamina<X.stamMax*.3?.45:.12);
    if(X.stamina<X.stamMax*.2&&(c==='clinch'||c==='circle'))v+=2;
    v+=(prior[c]||0)*1.2;
    return[c,v]});
  if(greedy)return scores.sort((p,q)=>q[1]-p[1])[0][0];
  const T=clamp(3.0-X.iq/40,.9,2.8);const mx=Math.max(...scores.map(s=>s[1]));
  const ws=scores.map(([c,v])=>[c,Math.exp((v-mx)/T)]);const sum=ws.reduce((s,e)=>s+e[1],0);
  let rr=Math.random()*sum;for(const[c,w]of ws){rr-=w;if(rr<=0)return c}
  return ws[0][0];
}

function catOf(k){const t=TECH[k];if(!t)return'def';if(t.kind==='punch'){if(t.target==='body')return'body';return t.type}
  if(t.kind==='def')return'def';if(t.kind==='clinch')return'clinch';if(k==='feint')return'feint';return'move'}
function makeTell(F,A,intent){
  const st=STYLES[A.style].mods;
  const p=clamp(.4+A.iq/250+(st.read||0)-A.swell/250-A.shock/300-A.sleepPen*.5,.15,.92);
  const c=catOf(intent);
  if(A.trueRead){A.trueRead=false;return{text:c==='feint'?'You read him clean: he is going to feint.':pick(TELL[c]),conf:.99,cat:c,sure:true}}
  let shown=c;
  if(c==='feint'){shown=Math.random()<p*.55?'feint':pick(['straight','hook'])}
  else if(Math.random()>p)shown=pick(Object.keys(TELL).filter(k=>k!==c));
  const text=shown==='feint'?'His shoulder twitches, but his feet stay set. Feint?':pick(TELL[shown]);
  return{text,conf:p,cat:shown};
}

  const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);
  return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}

function pline(g,x0,y0,x1,y1,w,c){g.fillStyle=c;const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));
  for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;g.fillRect(Math.round(x-w/2),Math.round(y-w/2),w,w)}}
function pell(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}

/* Side-view boxer. P = pose {lean,crouch,hdx,hdy,L:[x,y],R:[x,y],ext,...}. face: +1 right, -1 left. */
const ARM=24;
function ik(sx,sy,gx,gy,L1,L2,up){
  let dx=gx-sx,dy=gy-sy,d=Math.hypot(dx,dy);if(d<1)d=1;
  const max=L1+L2-.5;if(d>max){gx=sx+dx/d*max;gy=sy+dy/d*max;dx=gx-sx;dy=gy-sy;d=max}
  const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const px=sx+a*dx/d,py=sy+a*dy/d;let ex=px-h*dy/d,ey=py+h*dx/d,ex2=px+h*dy/d,ey2=py-h*dx/d;
  if(up?ey>ey2:ey<ey2){ex=ex2;ey=ey2}
  return[ex,ey,gx,gy];
}
function drawHair(g,style,hx,hy,face,c){
  if(style==='bald'){prect(g,hx-1,hy-5,2,1,shade(c,.25));return}
  const top=()=>{for(let i=-4;i<=4;i++){const h=Math.abs(i)>3?1:2;prect(g,hx+i,hy-6,1,h,c)}prect(g,hx-face*4-(face>0?1:0),hy-5,2,4,c)};
  if(style==='buzz'){for(let i=-4;i<=4;i++)prect(g,hx+i,hy-6,1,1,c);prect(g,hx-face*4-(face>0?0:1),hy-5,1,3,c)}
  else if(style==='crop'){top()}
  else if(style==='pomp'){top();prect(g,hx+face*1-(face>0?0:3),hy-9,4,3,c);prect(g,hx+face*4-(face>0?0:2),hy-8,3,2,c)}
  else if(style==='spiky'){top();for(let i=-3;i<=3;i+=2)prect(g,hx+i,hy-8-(i%4===1?1:0),1,2,c)}
  else if(style==='tied'){top();prect(g,hx-face*6-(face>0?1:0),hy-5,3,3,c)}
}
function drawBoxer(g,B,hipX,face,P,vis){
  const s=B.height/180,floor=154,crouch=P.crouch||0;
  const hipY=floor-30*s+crouch*.6, shX=hipX+face*(P.lean||0), shY=hipY-24*s+crouch*.3;
  const hx=shX+face*(2+(P.hdx||0)), hy=shY-8+(P.hdy||0);
  const skin=B.look.skin, skinD=shade(skin,-.25), glove=B.look.glove, gloveD=shade(glove,-.35);
  if(P.down){ // sprawled on the canvas
    const y=floor-3;pline(g,hipX,y,hipX-face*22,y-1,9,skin);prect(g,hipX-4,y-4,9,7,B.look.trunks);
    pell(g,hipX-face*28,y-3,5,4,skin);drawHair(g,B.look.hair,hipX-face*28,y+1,face,B.look.hairC);
    pline(g,hipX,y+1,hipX+face*18,y+2,4,skinD);pline(g,hipX-face*18,y-1,hipX-face*12,y-9,3,skinD);prect(g,hipX-face*12-3,y-12,6,6,glove);
    pline(g,hipX-face*20,y,hipX-face*26,y+3,3,skin);prect(g,hipX-face*27-3,y,6,5,glove);
    B._head=[hipX-face*28,y-3];B._body=[hipX-face*10,y];return}
  // legs
  const fF=hipX+face*10,bF=hipX-face*8,kY=hipY+13*s+crouch*.25;
  pline(g,hipX-face*2,hipY+4,hipX-face*4,kY,4,skinD);pline(g,hipX-face*4,kY,bF,floor-2,4,skinD);prect(g,bF-3,floor-2,7,2,'#18151f');
  pline(g,hipX+face*2,hipY+4,hipX+face*7,kY,4,skin);pline(g,hipX+face*7,kY,fF,floor-2,4,skin);prect(g,fF-3,floor-2,7,2,'#2a2633');
  // shoulders and gloves
  const sL=[shX+face*3,shY+2], sR=[shX-face*2,shY+1];
  const gl=P.Lw||[sL[0]+face*P.L[0],sL[1]+P.L[1]], gr=P.Rw||[sR[0]+face*P.R[0],sR[1]+P.R[1]];
  const L1=11.5*s,L2=12*s;
  const armR=ik(sR[0],sR[1],gr[0],gr[1],L1,L2,P.upR);
  pline(g,sR[0],sR[1],armR[0],armR[1],3,skinD);pline(g,armR[0],armR[1],armR[2],armR[3],3,skinD);
  prect(g,armR[2]-3,armR[3]-3,7,7,gloveD);
  // torso
  pline(g,hipX,hipY-2,shX,shY+4,10,skin);
  pline(g,hipX-face*3,hipY-2,shX-face*3,shY+4,2,skinD);
  if(vis&&vis.ribs>45)prect(g,hipX+face*1,hipY-12,3,3,'#6b4a8c');
  if(vis&&vis.liver>20)prect(g,hipX+face*(face>0?2:-4),hipY-8,3,3,'#7a3b5c');
  prect(g,hipX-6,hipY-4,12,10,B.look.trunks);prect(g,hipX-6,hipY-4,12,2,shade(B.look.trunks,.35));
  // head
  pline(g,shX+face*1,shY,hx-face*1,hy+4,4,skin);
  pell(g,hx,hy,4,5,skin);
  prect(g,hx+face*4-(face>0?0:1),hy-1,1,3,skin); // brow/nose ridge
  prect(g,hx+face*5-(face>0?0:1),hy+1,1,1,shade(skin,-.15));
  prect(g,hx+face*2-(face>0?0:1),hy-1,1,1,'#120f16'); // eye
  prect(g,hx+face*3-(face>0?0:1),hy+3,2,1,shade(skin,-.4)); // mouth
  prect(g,hx-face*1-(face>0?0:1),hy,1,2,skinD); // ear
  drawHair(g,B.look.hair,hx,hy,face,B.look.hairC);
  if(vis){
    if(vis.swell>25){const r=vis.swell>60?2:1;pell(g,hx+face*2,hy-1,r,r,'#7b5a9e');if(vis.swell>75)prect(g,hx+face*2-1,hy-1,3,1,'#3a2a4a')}
    if(vis.bleed>0){prect(g,hx+face*4-(face>0?0:1),hy+2,1,2,'#c2241c');if(vis.bleed>1)prect(g,hx+face*3-(face>0?0:1),hy+5,1,2,'#c2241c')}
    if(vis.flash>0){g.globalAlpha=vis.flash;pell(g,hx,hy,5,6,'#ffffff');g.globalAlpha=1}
  }
  // lead arm (front)
  const armL=ik(sL[0],sL[1],gl[0],gl[1],L1,L2,P.upL);
  pline(g,sL[0],sL[1],armL[0],armL[1],3,skin);pline(g,armL[0],armL[1],armL[2],armL[3],3,skin);
  prect(g,armL[2]-3,armL[3]-3,7,7,glove);prect(g,armL[2]-2,armL[3]-2,2,1,shade(glove,.45));prect(g,armL[2]-3,armL[3]+3,7,1,'#eee');
  B._head=[hx,hy];B._body=[lerp(hipX,shX,.5),lerp(hipY,shY,.45)];B._sh=[shX,shY];B._gl=[armL[2],armL[3]];B._gr=[armR[2],armR[3]];
}
/* Side-view poses: L/R = lead/rear glove offsets from shoulder (facing right). ext = which hand punches toward what. */
const SPOSE={
  neutral:{lean:2,crouch:2,L:[11,-6],R:[7,-8]},
  high:{lean:1,crouch:3,L:[8,-11],R:[6,-12]},
  low:{lean:3,crouch:5,L:[8,5],R:[5,7]},
  slip:{lean:6,crouch:5,hdx:3,hdy:5,L:[10,-3],R:[6,-4]},
  duck:{lean:11,crouch:11,hdx:4,hdy:12,L:[9,3],R:[5,2]},
  pull:{lean:-6,crouch:0,hdx:-3,hdy:-1,L:[10,-4],R:[4,-6]},
  feint:{lean:5,crouch:3,L:[16,-5],R:[7,-8]},
  clinch:{lean:9,crouch:4,hdx:4,hdy:3,L:[16,0],R:[14,2]},
  in:{lean:5,crouch:3,L:[11,-6],R:[7,-8]},out:{lean:-2,crouch:1,L:[10,-6],R:[6,-8]},circle:{lean:2,crouch:2,L:[11,-6],R:[7,-8]},
  frozen:{lean:-3,crouch:1,hdx:-2,hdy:1,L:[8,8],R:[5,10]},
  win:{lean:-2,crouch:0,hdy:-1,L:[2,-26],R:[-1,-26]},
  jab:{lean:4,crouch:2,L:[11,-6],R:[7,-9],ext:'L',to:'head'},
  cross:{lean:7,crouch:3,L:[8,-10],R:[7,-8],ext:'R',to:'head'},
  hook:{lean:5,crouch:4,L:[11,-6],R:[7,-10],ext:'L',to:'head',arc:'hook'},
  upper:{lean:5,crouch:7,L:[8,-10],R:[7,8],ext:'R',to:'head',arc:'upper'},
  overhand:{lean:8,crouch:3,L:[8,-9],R:[4,-12],ext:'R',to:'head',arc:'over'},
  bjab:{lean:7,crouch:8,L:[11,-2],R:[7,-8],ext:'L',to:'body'},
  bcross:{lean:8,crouch:8,L:[8,-9],R:[7,-2],ext:'R',to:'body'},
  liver:{lean:7,crouch:8,L:[11,0],R:[7,-9],ext:'L',to:'body',arc:'hook'},
};

/* ---------------------------- FRONT-VIEW ANATOMY ---------------------------- */
function anatomyData(src,isFighter){
  if(!isFighter){const b=src.body;return{skel:b.skel,muscle:b.muscle,organs:b.organs,fatigue:src.fatigue,shock:0,liver:0,swell:0,injuries:src.injuries}}
  const F=src,sk={};for(const k in F.bone)sk[k]=clamp(100-F.bone[k],0,100);sk.density=70;
  const base=F.isPlayer&&S.p?S.p.body:null;
  return{skel:sk,muscle:base?base.muscle:{neck:50,shoulders:50,core:50,back:50,legs:50,arms:50},
    organs:{heart:clamp(F.stamina/F.stamMax*100,0,100),lungs:clamp(F.stamina/F.stamMax*100+(F.bone.nose>40?-20:0),0,100),liver:clamp(100-F.liverLoad/F.liverMax*100,0,100),
      kidneys:100,brain:clamp(100-F.shock/F.chin*100,0,100)},fatigue:clamp(100-F.stamina/F.stamMax*100,0,100),shock:F.shock,swell:F.swell,injuries:[]};
}
function drawAnatomy(cv,D,layer,hit){
  const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
  const ox=48,oy=6,R=(x0,y0,x1,y1,c)=>prect(g,ox+x0,oy+y0,x1-x0,y1-y0,c);
  const sil='#3a3350';
  pell(g,ox,oy+9,8,9,sil);R(-3,18,3,22,sil);R(-16,22,16,28,sil);R(-12,26,12,58,sil);R(-11,58,11,66,sil);
  R(-17,24,-12,56,sil);R(12,24,17,56,sil);R(-10,66,-2,118,sil);R(2,66,10,118,sil);
  const sk=D.skel,mu=D.muscle,or=D.organs;
  if(layer==='skeleton'){
    pell(g,ox,oy+8,7,7,boneCol(sk.skull));pell(g,ox,oy+8,5,5,sil);
    pell(g,ox-3,oy+8,2,2,'#15131d');pell(g,ox+3,oy+8,2,2,'#15131d');
    g.strokeStyle=boneCol(sk.orbital);g.lineWidth=1;g.strokeRect(ox-5.5,oy+5.5,5,5);g.strokeRect(ox+.5,oy+5.5,5,5);
    R(-1,10,1,13,boneCol(sk.nose));R(-6,14,6,17,boneCol(sk.jaw));R(-4,17,4,18,boneCol(sk.jaw));
    for(let y=19;y<64;y+=2)R(-1,y,1,y+1,boneCol(sk.skull));
    R(-14,23,14,24,boneCol(100));
    for(let i=0;i<6;i++){const y=27+i*3;R(-11+i,y,-2,y+1,boneCol(sk.ribs));R(2,y,11-i,y+1,boneCol(sk.ribs));
      if(sk.ribs<55&&i===3){R(-8,y-1,-7,y+2,'#d4432f')}}
    R(-1,26,1,42,boneCol(sk.ribs));
    R(-10,56,10,60,boneCol(100));R(-8,60,-4,63,boneCol(100));R(4,60,8,63,boneCol(100));
    R(-15,25,-14,40,boneCol(100));R(-15,41,-14,55,boneCol(100));R(14,25,15,40,boneCol(100));R(14,41,15,55,boneCol(100));
    R(-17,55,-12,60,boneCol(sk.handR));R(12,55,17,60,boneCol(sk.handL));
    R(-7,66,-5,92,boneCol(100));R(-7,94,-5,116,boneCol(100));R(5,66,7,92,boneCol(100));R(5,94,7,116,boneCol(100));
    if(sk.jaw<50)R(-3,14,-2,18,'#d4432f');if(sk.nose<60)R(0,10,1,13,'#d4432f');
  }else if(layer==='muscle'){
    const mc=(v,f)=>{const t=clamp(v/100,0,1);const k=1-(f||0)/180;return`rgb(${Math.round((120+120*t)*k)},${Math.round((40+40*t)*k)},${Math.round((45+30*t)*k)})`};
    const f=D.fatigue;
    R(-4,18,4,22,mc(mu.neck,f));R(-9,20,-4,23,mc(mu.neck,f));R(4,20,9,23,mc(mu.neck,f));
    R(-16,22,-11,30,mc(mu.shoulders,f));R(11,22,16,30,mc(mu.shoulders,f));
    R(-11,25,-1,32,mc(mu.shoulders*.6+mu.arms*.4,f));R(1,25,11,32,mc(mu.shoulders*.6+mu.arms*.4,f));
    for(let i=0;i<3;i++){R(-5,34+i*6,-1,39+i*6,mc(mu.core,f));R(1,34+i*6,5,39+i*6,mc(mu.core,f))}
    R(-11,34,-6,54,mc(mu.core*.8,f));R(6,34,11,54,mc(mu.core*.8,f));
    R(-17,30,-12,42,mc(mu.arms,f));R(12,30,17,42,mc(mu.arms,f));R(-17,43,-12,55,mc(mu.arms*.9,f));R(12,43,17,55,mc(mu.arms*.9,f));
    R(-10,66,-2,92,mc(mu.legs,f));R(2,66,10,92,mc(mu.legs,f));R(-9,95,-3,112,mc(mu.legs*.9,f));R(3,95,9,112,mc(mu.legs*.9,f));
  }else if(layer==='organs'){
    pell(g,ox,oy+7,6,5,healthCol(or.brain));
    if(D.swell>30){pell(g,ox+3,oy+8,2,2,'#9479c4')}
    R(-10,26,-2,40,healthCol(or.lungs));R(2,26,10,40,healthCol(or.lungs));

    R(-11,40,-2,48,healthCol(or.liver));R(-11,48,-6,50,healthCol(or.liver));
    R(0,40,7,47,'#c99a6a');R(8,40,11,46,healthCol(or.liver*.5+50));

  }else if(layer==='hitbox'){
    const P=hit&&hit.pose?hit.pose:poseOf('neutral',{});
    for(const r of REG_HEAD)R(r[0]+P.hx,r[1]+P.hy,r[2]+P.hx,r[3]+P.hy,r[4]==='chin'?'#e7aa3d':r[4]==='temple'?'#d4432f':'#6b5f86');
    for(const r of REG_BODY)R(r[0]+P.tx,r[1]+P.ty,r[2]+P.tx,r[3]+P.ty,r[4]==='liver'?'#d4432f':r[4]==='solar'?'#e7aa3d':'#4e4568');
    g.globalAlpha=.85;for(const r of P.guards)R(r[0],r[1],r[2],r[3],'#2645a8');g.globalAlpha=1;

  }
}

  return`<div class="meter"><span>${label}</span><div class="track"><div class="fill" style="width:${pct}%;background:${color||'var(--gold)'}"></div></div><span class="v">${txt??Math.round(v)}</span></div>`}

function topStats(){
  const p=S.p,el=$('#topstats');if(!p||S.screen==='title'||S.screen==='create'){el.innerHTML='';return}
  const f=p.fight?(p.fight.weeks===0?'FIGHT THIS WEEK':`Fight in ${p.fight.weeks+1} wk`):'No fight booked';

/* ---------------------------- LIFE SIMULATION ---------------------------- */
function effTrain(p){return clamp((1-p.fatigue/140)*(1-p.sleepDebt/40)*(p.nutrition<45?.55:1)*(p.stress>75?.8:1),.1,1.15)}
function gain(obj,k,amt){obj[k]=clamp(obj[k]+amt*(1-obj[k]/115),0,100)}
function hasInjury(p,part){return p.injuries.some(i=>i.part===part)}
function addInjury(p,inj,L){
  const ex=p.injuries.find(i=>i.part===inj.part);
  if(ex){ex.days+=inj.days/2}else p.injuries.push(Object.assign({},inj));
  if(inj.skel)for(const k in inj.skel)p.body.skel[k]=clamp(p.body.skel[k]-inj.skel[k],5,100);
  if(inj.brain)p.body.organs.brain=clamp(p.body.organs.brain-inj.brain,10,100);
  L(`Injury: ${inj.n}.`,'bad');
}
const INJ={
  spar:[{n:'Broken nose (sparring)',part:'nose',days:14,skel:{nose:35}},{n:'Swollen eye',part:'orbital',days:7,skel:{orbital:20}},{n:'Concussion',part:'brain',days:14,brain:2},{n:'Bruised ribs',part:'ribs',days:10,skel:{ribs:25}}],
  dock:[{n:'Strained lower back',part:'back',days:10},{n:'Crushed hand on a crate',part:'hand',days:21,skel:{handR:35}}],
  bag:[{n:'Sprained wrist',part:'hand',days:10,skel:{handR:15}}],
  street:[{n:'Busted knuckles',part:'hand',days:14,skel:{handL:25}}],
};
function doAct(p,k,L,day){
  const A=ACT[k],eff=effTrain(p);
  if(A.train&&p.fatigue>92){L(`${ACT[k].n}: too wrecked to do anything useful. You go through the motions.`,'bad');p.fatigue+=4;return}
  if(A.g){const tgt=Object.assign({},p.body.muscle,p.body.organs);for(const[s,v]of Object.entries(A.g)){if(s in p.body.muscle)gain(p.body.muscle,s,v*eff*(p.nutrition<40?.3:1));else gain(p.body.organs,s,v*eff)}}
  if(A.sk)for(const[s,v]of Object.entries(A.sk))gain(p.skills,s,v*eff);
  if(A.bone&&p.nutrition>60)p.body.skel.density=clamp(p.body.skel.density+A.bone,0,100);
  if(A.brain){const loss=-A.brain*(1-p.skills.defense/200);p.body.organs.brain=clamp(p.body.organs.brain-loss,10,100);p.body.organs.brainCap=clamp(p.body.organs.brainCap-loss*.3,30,100)}
  if(A.hand&&hasInjury(p,'hand')){p.injuries.find(i=>i.part==='hand').days+=2;L('Your hand screams on the bag. You are making it worse.','bad')}
  if(A.fat)p.fatigue=clamp(p.fatigue+A.fat*(A.train&&p.nutrition<40?1.2:1),0,100);
  if(A.stress)p.stress=clamp(p.stress+A.stress,0,100);
  if(A.money)p.money+=A.money;
  if(A.nutr)p.nutrition=clamp(p.nutrition+A.nutr,0,100);
  if(A.dues)p._dues=(p._dues||0)+A.dues;
  if(A.gym)p._gym=true;
  if(A.train)p._trained=(p._trained||0)+1;
  if(A.g&&(A.g.heart||A.g.lungs))p._cardio=true;
  if(A.bond)for(const[w,v]of Object.entries(A.bond)){p.rel[w].bond=clamp(p.rel[w].bond+v,0,100);p._saw[w]=true}
  if(k==='mina'||k==='rosa')p._saw[k]=true;
  if(k==='mitts'||k==='spar'||k==='bag'||k==='rope')p._saw.pop=true;
  if(A.risk){const risk=A.risk*(1+p.fatigue/45+p.sleepDebt/18)*(k==='spar'?(1-p.skills.defense/250):1);
    if(Math.random()<risk)addInjury(p,pick(INJ[k]||INJ.dock),L)}
  if(k==='spar'&&Math.random()<.18){p.rel.dex.bond=clamp(p.rel.dex.bond+3,0,100);L('Word gets back that Dex watched your sparring from the door and laughed.','')}
  if(A.liver)p.body.organs.liver=clamp(p.body.organs.liver+A.liver,20,100);
}
function nightAndBody(p,k,L){
  const A=ACT[k];doAct(p,k,()=>{});
  const h=A.sleep;
  const q=p.stress>70?.7:1;
  if(h>=8)p.sleepDebt=Math.max(0,p.sleepDebt-2.5*q);else p.sleepDebt=clamp(p.sleepDebt+(8-h)*.8,0,40);
  p.fatigue=clamp(p.fatigue-h*3.6*q*(p.nutrition<40?.75:1),0,100);
  const tgt=GROCERY[p.grocery].target;p.nutrition=clamp(p.nutrition+(tgt-p.nutrition)*.25,0,100);
  p.stress=clamp(p.stress+(30-p.stress)*.05+(p.money<0?4:0)+(p.sleepDebt>12?2:0),0,100);
  if(p.nutrition<40){for(const m in p.body.muscle)p.body.muscle[m]=Math.max(10,p.body.muscle[m]-.15);p.body.skel.density=Math.max(30,p.body.skel.density-.05)}
  if(!p._cardio){p.body.organs.heart=Math.max(15,p.body.organs.heart-.05);p.body.organs.lungs=Math.max(15,p.body.organs.lungs-.04)}
  const heal=(p.nutrition/70)*(p.sleepDebt<6?1:.55);
  for(const i of p.injuries)i.days-=heal*(p._trained&&['hand','ribs','nose','back'].includes(i.part)?.7:1);
  const healed=p.injuries.filter(i=>i.days<=0);p.injuries=p.injuries.filter(i=>i.days>0);healed.forEach(i=>L(`Healed: ${i.n}.`,'good'));
  for(const b of['skull','jaw','nose','orbital','ribs','handL','handR'])if(!p.injuries.some(i=>i.part===b||(b.startsWith('hand')&&i.part==='hand')))p.body.skel[b]=Math.min(100,p.body.skel[b]+.9*heal);
  p.body.organs.brain=Math.min(p.body.organs.brainCap,p.body.organs.brain+.06*heal);
  p.body.organs.liver=Math.min(100,p.body.organs.liver+.5);
  p.weight=clamp(p.weight+(p.nutrition-58)/900-(p._trained||0)*.012,50,95);
  for(const w of['mina','rosa','pop'])if(!p._saw[w])p.rel[w].bond=Math.max(0,p.rel[w].bond-(w==='pop'?.25:.45));
}

  L(`— Week ${p.week} —`,'d');
  $('#pl-go').disabled=true;
  let d=0;
  const fightDays=p.fight&&p.fight.weeks===0?5:7;
  const step=()=>{
    if(d>=fightDays)return endWeek(L);
    p._saw={};p._trained=0;p._cardio=false;
    const plan=p.plan[d],before={f:p.fatigue,s:p.sleepDebt};
    for(let s=0;s<3;s++)doAct(p,plan[s],L,d);
    nightAndBody(p,plan[3],L);clampAll(p);
    let line=`${DAYS[d]}: ${plan.slice(0,3).map(k=>ACT[k].n).join(', ')}; ${ACT[plan[3]].n.toLowerCase()}.`;
    if(p.fatigue>85)line+=' Your legs feel like wet sand.';else if(p.sleepDebt>12)line+=' You keep nodding off on the bus.';else if(p.nutrition<35)line+=' Dizzy in the shower.';
    L(line,p.fatigue>85||p.sleepDebt>12?'bad':'');
    d++;

function applyExchange(F,ex,a,b){

    let cost=t?t.cost:0;if(k==='out'&&STYLES[X.style].mods.outFree)cost=0;

    const X=sides[h.att],Y=sides[h.def],t=TECH[h.tech];
    const P=h.pose||poseOf(acts[h.def],{defSouthpaw:Y.southpaw,attSouthpaw:X.southpaw,exec:1,frozen:wasF[h.def]>0,tight:STYLES[Y.style].mods.tightGuard});
    F.hitInfo={def:h.def,pose:P,shape:shapeFor(h.tech,X.southpaw),res:h.res,txt:`${X.short}'s ${t.n.toLowerCase()}: ${h.res}${h.region?' '+REGFX[h.region].lbl:''}`};
